<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Task Nexus">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Precision discipline tracker - task management with analytics">
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%230f172a' width='180' height='180'/><text x='90' y='100' font-size='80' font-weight='300' text-anchor='middle' fill='white' font-family='system-ui'>✓</text></svg>">
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%230f172a' width='32' height='32'/><text x='16' y='22' font-size='20' font-weight='300' text-anchor='middle' fill='white' font-family='system-ui'>✓</text></svg>">
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="data:application/manifest+json,{
        'name': 'Task Nexus',
        'short_name': 'Tasks',
        'description': 'Precision discipline tracker with analytics',
        'start_url': '/',
        'display': 'standalone',
        'orientation': 'portrait-primary',
        'scope': '/',
        'background_color': '#ffffff',
        'theme_color': '#0f172a',
        'icons': [
            {
                'src': 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 192 192%22><rect fill=%22%230f172a%22 width=%22192%22 height=%22192%22/><text x=%2296%22 y=%22130%22 font-size=%22100%22 font-weight=%22300%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22system-ui%22>✓</text></svg>',
                'sizes': '192x192',
                'type': 'image/svg+xml',
                'purpose': 'any'
            }
        ]
    }">
    
    <title>Task Nexus</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            color: #0f172a;
            overflow: hidden;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f1f5f9;
        }

        #app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* Header */
        .header {
            padding: max(1rem, env(safe-area-inset-top)) 1.5rem 1rem;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(10px);
            flex-shrink: 0;
            z-index: 100;
        }

        body.dark-mode .header {
            background: rgba(15,23,42,0.7);
            border-bottom-color: rgba(255,255,255,0.05);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .header-title {
            font-size: 1.75rem;
            font-weight: 300;
            letter-spacing: -0.5px;
        }

        .header-subtitle {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 0.25rem;
            font-weight: 400;
        }

        body.dark-mode .header-subtitle {
            color: #94a3b8;
        }

        .tab-buttons {
            display: flex;
            gap: 0.75rem;
        }

        .tab-btn {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #e2e8f0;
            color: #475569;
        }

        body.dark-mode .tab-btn {
            background: #334155;
            color: #cbd5e1;
        }

        .tab-btn.active {
            background: #0f172a;
            color: white;
        }

        body.dark-mode .tab-btn.active {
            background: #f1f5f9;
            color: #0f172a;
        }

        /* Main Content */
        .content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 1rem;
            padding-bottom: max(1rem, env(safe-area-inset-bottom));
        }

        /* Today Tab */
        .today-section {
            display: none;
        }

        .today-section.active {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* Carousel */
        .carousel {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .carousel-btn {
            flex-shrink: 0;
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 0.5rem;
            background: white;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        body.dark-mode .carousel-btn {
            background: #1e293b;
            border-color: #334155;
        }

        .carousel-btn:active {
            transform: scale(0.9);
        }

        .carousel-dates {
            flex: 1;
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            padding: 0.25rem;
        }

        .carousel-dates::-webkit-scrollbar {
            display: none;
        }

        .date-button {
            flex-shrink: 0;
            width: 5.5rem;
            padding: 1rem 0.75rem;
            border-radius: 0.75rem;
            background: white;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            font-size: 0.75rem;
            color: #64748b;
        }

        body.dark-mode .date-button {
            background: #1e293b;
            border-color: #334155;
            color: #94a3b8;
        }

        .date-button.selected {
            background: #0f172a;
            border-color: #0f172a;
            color: white;
            transform: scale(1.05);
        }

        body.dark-mode .date-button.selected {
            background: #f1f5f9;
            border-color: #f1f5f9;
            color: #0f172a;
        }

        .date-day {
            font-size: 1.5rem;
            font-weight: 300;
            margin-top: 0.25rem;
        }

        /* Progress Cards */
        .progress-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .card {
            background: white;
            border-radius: 0.75rem;
            padding: 1.25rem;
            border: 1px solid #e2e8f0;
        }

        body.dark-mode .card {
            background: #1e293b;
            border-color: #334155;
        }

        .card-label {
            font-size: 0.75rem;
            color: #64748b;
            font-weight: 500;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        body.dark-mode .card-label {
            color: #94a3b8;
        }

        .card-value {
            font-size: 2rem;
            font-weight: 300;
            margin-bottom: 0.5rem;
        }

        .card-subtext {
            font-size: 0.75rem;
            color: #64748b;
        }

        body.dark-mode .card-subtext {
            color: #94a3b8;
        }

        .progress-bar {
            width: 100%;
            height: 0.25rem;
            background: #e2e8f0;
            border-radius: 9999px;
            margin-top: 1rem;
            overflow: hidden;
        }

        body.dark-mode .progress-bar {
            background: #334155;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6 0%, #06b6d4 100%);
            transition: width 0.5s ease;
            border-radius: 9999px;
        }

        /* Tasks Container */
        .tasks-container {
            background: white;
            border-radius: 0.75rem;
            border: 1px solid #e2e8f0;
            overflow: hidden;
        }

        body.dark-mode .tasks-container {
            background: #1e293b;
            border-color: #334155;
        }

        .tasks-header {
            padding: 1.25rem;
            border-bottom: 1px solid #e2e8f0;
        }

        body.dark-mode .tasks-header {
            border-bottom-color: #334155;
        }

        .tasks-header h2 {
            font-size: 1rem;
            font-weight: 300;
        }

        .task-list {
            divide: none;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.25rem;
            border-bottom: 1px solid #e2e8f0;
            transition: background 0.2s ease;
            user-select: none;
        }

        body.dark-mode .task-item {
            border-bottom-color: #334155;
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .task-item:active {
            background: rgba(0,0,0,0.02);
        }

        body.dark-mode .task-item:active {
            background: rgba(255,255,255,0.02);
        }

        .checkbox {
            width: 1.5rem;
            height: 1.5rem;
            border: 2px solid #cbd5e1;
            border-radius: 0.375rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        body.dark-mode .checkbox {
            border-color: #475569;
        }

        .checkbox.checked {
            background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
            border-color: #3b82f6;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
        }

        .checkbox.checked::after {
            content: '✓';
            color: white;
            font-size: 1rem;
            font-weight: 600;
        }

        .task-content {
            flex: 1;
        }

        .task-name {
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .task-item.completed .task-name {
            color: #94a3b8;
            text-decoration: line-through;
        }

        .task-meta {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 0.25rem;
        }

        body.dark-mode .task-meta {
            color: #94a3b8;
        }

        .task-delete {
            width: 2rem;
            height: 2rem;
            border-radius: 0.375rem;
            background: transparent;
            border: none;
            color: #ef4444;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            padding: 0;
            font-size: 1.25rem;
            flex-shrink: 0;
        }

        .task-delete:active {
            background: rgba(239, 68, 68, 0.1);
            transform: scale(0.9);
        }

        .tasks-footer {
            padding: 1.25rem;
            border-top: 1px solid #e2e8f0;
        }

        body.dark-mode .tasks-footer {
            border-top-color: #334155;
        }

        .add-task-btn {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.5rem;
            background: #f1f5f9;
            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: #0f172a;
        }

        body.dark-mode .add-task-btn {
            background: #334155;
            color: #f1f5f9;
        }

        .add-task-btn:active {
            transform: scale(0.95);
        }

        .add-task-form {
            display: none;
            flex-direction: column;
            gap: 0.75rem;
        }

        .add-task-form.show {
            display: flex;
        }

        .form-input, .form-select {
            padding: 0.75rem;
            border-radius: 0.5rem;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            font-size: 1rem;
            color: #0f172a;
            font-family: inherit;
        }

        body.dark-mode .form-input,
        body.dark-mode .form-select {
            background: #334155;
            border-color: #475569;
            color: #f1f5f9;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .form-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .form-btn {
            flex: 1;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .form-btn.add {
            background: #0f172a;
            color: white;
        }

        body.dark-mode .form-btn.add {
            background: #f1f5f9;
            color: #0f172a;
        }

        .form-btn.add:active {
            transform: scale(0.95);
        }

        .form-btn.cancel {
            background: #e2e8f0;
            color: #0f172a;
        }

        body.dark-mode .form-btn.cancel {
            background: #475569;
            color: #f1f5f9;
        }

        .form-btn.cancel:active {
            transform: scale(0.95);
        }

        /* Analytics Tab */
        .analytics-section {
            display: none;
        }

        .analytics-section.active {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }

        .stat-card {
            background: white;
            border-radius: 0.75rem;
            padding: 1rem;
            border: 1px solid #e2e8f0;
        }

        body.dark-mode .stat-card {
            background: #1e293b;
            border-color: #334155;
        }

        .stat-label {
            font-size: 0.65rem;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        body.dark-mode .stat-label {
            color: #94a3b8;
        }

        .stat-value {
            font-size: 1.75rem;
            font-weight: 300;
        }

        /* Charts */
        .chart-container {
            background: white;
            border-radius: 0.75rem;
            padding: 1.25rem;
            border: 1px solid #e2e8f0;
        }

        body.dark-mode .chart-container {
            background: #1e293b;
            border-color: #334155;
        }

        .chart-title {
            font-size: 1rem;
            font-weight: 300;
            margin-bottom: 1rem;
        }

        .chart-placeholder {
            width: 100%;
            height: 200px;
            background: #f8fafc;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-size: 0.875rem;
        }

        body.dark-mode .chart-placeholder {
            background: #0f172a;
            color: #64748b;
        }

        .simple-chart {
            display: flex;
            align-items: flex-end;
            gap: 0.4rem;
            height: 150px;
            padding: 1rem 0;
            border-bottom: 1px solid #e2e8f0;
        }

        body.dark-mode .simple-chart {
            border-bottom-color: #334155;
        }

        .chart-bar {
            flex: 1;
            background: linear-gradient(180deg, #3b82f6 0%, #06b6d4 100%);
            border-radius: 0.25rem 0.25rem 0 0;
            position: relative;
            min-height: 2px;
            transition: all 0.3s ease;
        }

        .chart-labels {
            display: flex;
            gap: 0.4rem;
            padding: 0.5rem 0;
            font-size: 0.65rem;
            color: #64748b;
        }

        body.dark-mode .chart-labels {
            color: #94a3b8;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 2rem 1rem;
            color: #64748b;
        }

        body.dark-mode .empty-state {
            color: #94a3b8;
        }

        .empty-state p {
            font-size: 0.875rem;
        }

        /* Dark Mode Toggle (hidden for now) */
        .dark-toggle {
            position: fixed;
            bottom: 2rem;
            right: 1rem;
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
            background: #0f172a;
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            z-index: 50;
            opacity: 0.3;
        }

        .dark-toggle:active {
            transform: scale(0.9);
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
                color: #f1f5f9;
            }
        }

        @supports (padding: max(0px)) {
            body {
                padding-left: env(safe-area-inset-left);
                padding-right: env(safe-area-inset-right);
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            <div class="header-top">
                <div>
                    <div class="header-title">Task Nexus</div>
                    <div class="header-subtitle">Precision discipline tracker</div>
                </div>
                <div class="tab-buttons">
                    <button class="tab-btn active" data-tab="today">Today</button>
                    <button class="tab-btn" data-tab="analytics">Analytics</button>
                </div>
            </div>
        </div>

        <div class="content">
            <!-- Today Tab -->
            <div class="today-section active" id="today-tab">
                <!-- Carousel -->
                <div class="carousel">
                    <button class="carousel-btn" id="prev-day">←</button>
                    <div class="carousel-dates" id="carousel-dates"></div>
                    <button class="carousel-btn" id="next-day">→</button>
                </div>

                <!-- Progress Cards -->
                <div class="progress-grid">
                    <div class="card">
                        <div class="card-label">Today's Progress</div>
                        <div class="card-value" id="today-progress">0%</div>
                        <div class="card-subtext" id="today-tasks">0 of 0 tasks</div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-label">Current Streak</div>
                        <div class="card-value" id="current-streak">0<span style="font-size: 0.75rem; color: #64748b;">d</span></div>
                        <div class="card-subtext" id="best-streak">Personal best: 0 days</div>
                    </div>
                </div>

                <!-- Tasks -->
                <div class="tasks-container">
                    <div class="tasks-header">
                        <h2 id="selected-date"></h2>
                    </div>
                    <div class="task-list" id="task-list"></div>
                    <div class="tasks-footer">
                        <button class="add-task-btn" id="add-task-btn">
                            <span>+ Add Task</span>
                        </button>
                        <form class="add-task-form" id="add-task-form">
                            <input type="text" class="form-input" id="task-input" placeholder="Task name..." required>
                            <select class="form-select" id="task-freq">
                                <option value="daily">Daily</option>
                                <option value="weekly">Weekly</option>
                                <option value="custom">Custom</option>
                            </select>
                            <div class="form-buttons">
                                <button type="submit" class="form-btn add">Add</button>
                                <button type="button" class="form-btn cancel" id="cancel-task">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Analytics Tab -->
            <div class="analytics-section" id="analytics-tab">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Completion %</div>
                        <div class="stat-value" id="stat-completion">0%</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Streak</div>
                        <div class="stat-value" id="stat-streak">0<span style="font-size: 0.65rem;">d</span></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Week Avg</div>
                        <div class="stat-value" id="stat-weekavg">0%</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Best Day</div>
                        <div class="stat-value" id="stat-bestday">0%</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Worst Day</div>
                        <div class="stat-value" id="stat-worstday">0%</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Best Streak</div>
                        <div class="stat-value" id="stat-beststreak">0<span style="font-size: 0.65rem;">d</span></div>
                    </div>
                </div>

                <div class="chart-container">
                    <div class="chart-title">Last 7 Days</div>
                    <div class="simple-chart" id="chart-7days"></div>
                    <div class="chart-labels" id="labels-7days"></div>
                </div>

                <div class="chart-container">
                    <div class="chart-title">Last 30 Days</div>
                    <div class="simple-chart" id="chart-30days"></div>
                    <div class="chart-labels" id="labels-30days"></div>
                </div>

                <div class="chart-container">
                    <div class="chart-title">12-Week Heatmap</div>
                    <div id="heatmap-container"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // App State
        const state = {
            tasks: [],
            completionHistory: {},
            selectedDate: new Date(),
            activeTab: 'today'
        };

        const defaultTasks = [
            { id: 1, name: 'Morning Workout', frequency: 'daily', category: 'fitness' },
            { id: 2, name: 'Code Review', frequency: 'daily', category: 'work' },
            { id: 3, name: 'Meditation', frequency: 'daily', category: 'habits' },
            { id: 4, name: 'Read Article', frequency: 'daily', category: 'habits' }
        ];

        // Initialize
        function init() {
            // Set dark mode based on system preference
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.body.classList.add('dark-mode');
            }

            // Load from localStorage
            const stored = localStorage.getItem('taskTrackerData');
            if (stored) {
                try {
                    const data = JSON.parse(stored);
                    state.tasks = data.tasks || defaultTasks;
                    state.completionHistory = data.history || {};
                } catch {
                    state.tasks = defaultTasks;
                }
            } else {
                state.tasks = defaultTasks;
            }

            // Event listeners
            document.getElementById('prev-day').addEventListener('click', () => changeDay(-1));
            document.getElementById('next-day').addEventListener('click', () => changeDay(1));
            document.getElementById('add-task-btn').addEventListener('click', toggleAddTaskForm);
            document.getElementById('add-task-form').addEventListener('submit', addNewTask);
            document.getElementById('cancel-task').addEventListener('click', toggleAddTaskForm);

            // Tab buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', (e) => switchTab(e.target.dataset.tab));
            });

            // Service Worker
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('data:application/javascript,' + encodeURIComponent(`
                    self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
                    self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
                    self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
                `, { type: 'application/javascript' })).catch(() => {});
            }

            render();
        }

        // Date Formatting
        function formatDate(date) {
            return date.toISOString().split('T')[0];
        }

        function changeDay(days) {
            state.selectedDate.setDate(state.selectedDate.getDate() + days);
            render();
        }

        function getCarouselDates() {
            const dates = [];
            for (let i = -1; i <= 3; i++) {
                const d = new Date(state.selectedDate);
                d.setDate(d.getDate() + i);
                dates.push(d);
            }
            return dates;
        }

        // Task Management
        function isTaskCompleted(taskId, date) {
            const key = `${taskId}_${formatDate(date)}`;
            return state.completionHistory[key] || false;
        }

        function toggleTaskCompletion(taskId) {
            const key = `${taskId}_${formatDate(state.selectedDate)}`;
            state.completionHistory[key] = !state.completionHistory[key];
            save();
            render();
        }

        function deleteTask(taskId) {
            state.tasks = state.tasks.filter(t => t.id !== taskId);
            Object.keys(state.completionHistory).forEach(key => {
                if (key.startsWith(`${taskId}_`)) delete state.completionHistory[key];
            });
            save();
            render();
        }

        function toggleAddTaskForm() {
            document.getElementById('add-task-form').classList.toggle('show');
            if (document.getElementById('add-task-form').classList.contains('show')) {
                document.getElementById('task-input').focus();
            }
        }

        function addNewTask(e) {
            e.preventDefault();
            const input = document.getElementById('task-input');
            const freq = document.getElementById('task-freq').value;
            
            if (!input.value.trim()) return;

            const newTask = {
                id: Math.max(...state.tasks.map(t => t.id), 0) + 1,
                name: input.value.trim(),
                frequency: freq,
                category: 'habits'
            };

            state.tasks.push(newTask);
            input.value = '';
            toggleAddTaskForm();
            save();
            render();
        }

        // Statistics
        function getStats() {
            const today = new Date();
            
            const getDateRange = (days) => {
                const dates = [];
                for (let i = days - 1; i >= 0; i--) {
                    const d = new Date(today);
                    d.setDate(d.getDate() - i);
                    dates.push(formatDate(d));
                }
                return dates;
            };

            const buildChartData = (days) => {
                return days.map(dateStr => {
                    const completedCount = state.tasks.filter(t => state.completionHistory[`${t.id}_${dateStr}`]).length;
                    return {
                        date: dateStr,
                        completion: state.tasks.length > 0 ? Math.round((completedCount / state.tasks.length) * 100) : 0
                    };
                });
            };

            const last7 = getDateRange(7);
            const last30 = getDateRange(30);
            const chart7 = buildChartData(last7);
            const chart30 = buildChartData(last30);

            const todayKey = formatDate(today);
            const todayCompleted = state.tasks.filter(t => state.completionHistory[`${t.id}_${todayKey}`]).length;
            const todayCompletionPct = state.tasks.length > 0 ? Math.round((todayCompleted / state.tasks.length) * 100) : 0;

            // Streaks
            let currentStreak = 0, longestStreak = 0, tempStreak = 0;
            for (let i = 0; i < 365; i++) {
                const d = new Date(today);
                d.setDate(d.getDate() - i);
                const dateStr = formatDate(d);
                const completed = state.tasks.filter(t => state.completionHistory[`${t.id}_${dateStr}`]).length === state.tasks.length;
                if (completed) {
                    tempStreak++;
                    if (i === 0) currentStreak = tempStreak;
                } else {
                    longestStreak = Math.max(longestStreak, tempStreak);
                    tempStreak = 0;
                }
            }
            longestStreak = Math.max(longestStreak, tempStreak);

            const weeklyAvg = Math.round(chart7.reduce((sum, d) => sum + d.completion, 0) / 7);
            const bestDay = Math.max(...chart30.map(d => d.completion));
            const worstDay = Math.min(...chart30.map(d => d.completion));

            return {
                todayCompletionPct,
                todayCompleted,
                currentStreak,
                longestStreak,
                weeklyAvg,
                bestDay,
                worstDay,
                chart7,
                chart30
            };
        }

        // Rendering
        function render() {
            renderCarousel();
            renderTasks();
            renderProgress();
            renderAnalytics();
        }

        function renderCarousel() {
            const container = document.getElementById('carousel-dates');
            const today = new Date();
            
            container.innerHTML = getCarouselDates().map(date => {
                const isSelected = formatDate(date) === formatDate(state.selectedDate);
                const isToday = formatDate(date) === formatDate(today);
                
                return `
                    <button class="date-button ${isSelected ? 'selected' : ''}" data-date="${formatDate(date)}">
                        <div>${date.toLocaleDateString('en-US', { weekday: 'short' })}</div>
                        <div class="date-day">${date.getDate()}</div>
                        ${isToday && !isSelected ? '<div style="color: #3b82f6; font-weight: 600; font-size: 0.65rem; margin-top: 0.25rem;">Now</div>' : ''}
                    </button>
                `;
            }).join('');

            document.querySelectorAll('.date-button').forEach(btn => {
                btn.addEventListener('click', () => {
                    state.selectedDate = new Date(btn.dataset.date);
                    render();
                });
            });
        }

        function renderTasks() {
            const today = new Date();
            const todayCompleted = state.tasks.filter(t => isTaskCompleted(t.id, state.selectedDate)).length;
            const todayPct = state.tasks.length > 0 ? Math.round((todayCompleted / state.tasks.length) * 100) : 0;

            document.getElementById('selected-date').textContent = 
                state.selectedDate.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });

            const taskList = document.getElementById('task-list');
            if (state.tasks.length === 0) {
                taskList.innerHTML = '<div class="empty-state"><p>No tasks yet. Add one to get started.</p></div>';
            } else {
                taskList.innerHTML = state.tasks.map(task => {
                    const isCompleted = isTaskCompleted(task.id, state.selectedDate);
                    return `
                        <div class="task-item ${isCompleted ? 'completed' : ''}">
                            <div class="checkbox ${isCompleted ? 'checked' : ''}" data-task-id="${task.id}"></div>
                            <div class="task-content">
                                <div class="task-name">${task.name}</div>
                                <div class="task-meta">${task.category} · ${task.frequency}</div>
                            </div>
                            <button class="task-delete" data-task-id="${task.id}">🗑</button>
                        </div>
                    `;
                }).join('');

                document.querySelectorAll('.checkbox').forEach(cb => {
                    cb.addEventListener('click', () => toggleTaskCompletion(parseInt(cb.dataset.taskId)));
                });

                document.querySelectorAll('.task-delete').forEach(btn => {
                    btn.addEventListener('click', () => deleteTask(parseInt(btn.dataset.taskId)));
                });
            }
        }

        function renderProgress() {
            const stats = getStats();
            document.getElementById('today-progress').textContent = stats.todayCompletionPct + '%';
            document.getElementById('today-tasks').textContent = `${stats.todayCompleted} of ${state.tasks.length} tasks`;
            document.getElementById('progress-fill').style.width = stats.todayCompletionPct + '%';
            document.getElementById('current-streak').innerHTML = `${stats.currentStreak}<span style="font-size: 0.75rem; color: #64748b;">d</span>`;
            document.getElementById('best-streak').textContent = `Personal best: ${stats.longestStreak} days`;
        }

        function renderAnalytics() {
            const stats = getStats();

            document.getElementById('stat-completion').textContent = stats.todayCompletionPct + '%';
            document.getElementById('stat-streak').innerHTML = `${stats.currentStreak}<span style="font-size: 0.65rem;">d</span>`;
            document.getElementById('stat-weekavg').textContent = stats.weeklyAvg + '%';
            document.getElementById('stat-bestday').textContent = stats.bestDay + '%';
            document.getElementById('stat-worstday').textContent = stats.worstDay + '%';
            document.getElementById('stat-beststreak').innerHTML = `${stats.longestStreak}<span style="font-size: 0.65rem;">d</span>`;

            // 7-day chart
            const chart7 = document.getElementById('chart-7days');
            const labels7 = document.getElementById('labels-7days');
            const maxVal = Math.max(...stats.chart7.map(d => d.completion), 1);
            
            chart7.innerHTML = stats.chart7.map(d => {
                const height = (d.completion / maxVal) * 100;
                return `<div class="chart-bar" style="height: ${height}%"></div>`;
            }).join('');
            
            labels7.innerHTML = stats.chart7.map(d => {
                const date = new Date(d.date);
                return `<div>${date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</div>`;
            }).join('');

            // 30-day chart
            const chart30 = document.getElementById('chart-30days');
            const labels30 = document.getElementById('labels-30days');
            const maxVal30 = Math.max(...stats.chart30.map(d => d.completion), 1);
            
            chart30.innerHTML = stats.chart30.slice(-30).map(d => {
                const height = (d.completion / maxVal30) * 100;
                return `<div class="chart-bar" style="height: ${height}%"></div>`;
            }).join('');
            
            labels30.innerHTML = stats.chart30.slice(-30).map((d, i) => {
                return i % 6 === 0 ? `<div>${new Date(d.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</div>` : '<div></div>';
            }).join('');

            // Heatmap
            renderHeatmap();
        }

        function renderHeatmap() {
            const today = new Date();
            const container = document.getElementById('heatmap-container');
            let html = '<div style="overflow-x: auto; -webkit-overflow-scrolling: touch;">';
            
            for (let i = 11; i >= 0; i--) {
                const d = new Date(today);
                d.setDate(d.getDate() - i * 7);
                const weekStart = new Date(d);
                weekStart.setDate(weekStart.getDate() - weekStart.getDay());
                
                let weekCompletion = 0;
                for (let j = 0; j < 7; j++) {
                    const checkDate = new Date(weekStart);
                    checkDate.setDate(checkDate.getDate() + j);
                    const dateStr = formatDate(checkDate);
                    const completed = state.tasks.filter(t => state.completionHistory[`${t.id}_${dateStr}`]).length === state.tasks.length;
                    if (completed) weekCompletion++;
                }
                const intensity = Math.round((weekCompletion / 7) * 100);
                const alpha = intensity / 100;
                
                html += `
                    <div style="display: flex; align-items: center; margin-bottom: 0.75rem;">
                        <div style="width: 40px; font-size: 0.65rem; color: #64748b;">W${12 - i}</div>
                        <div style="flex: 1; height: 20px; background: rgba(139, 92, 246, ${alpha}); border-radius: 0.25rem; margin-right: 0.5rem;"></div>
                        <div style="width: 30px; text-align: right; font-size: 0.65rem; color: #64748b;">${intensity}%</div>
                    </div>
                `;
            }
            
            html += '</div>';
            container.innerHTML = html;
        }

        function switchTab(tab) {
            state.activeTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
            
            document.getElementById('today-tab').classList.remove('active');
            document.getElementById('analytics-tab').classList.remove('active');
            
            if (tab === 'today') {
                document.getElementById('today-tab').classList.add('active');
            } else {
                document.getElementById('analytics-tab').classList.add('active');
            }
        }

        function save() {
            localStorage.setItem('taskTrackerData', JSON.stringify({
                tasks: state.tasks,
                history: state.completionHistory
            }));
        }

        // Initialize app
        init();
    </script>
</body>
</html>
